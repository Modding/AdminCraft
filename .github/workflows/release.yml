name: Release

# Same scheme as the other Craft apps:
# - the version lives in Cargo.toml (semantic versioning, 0.x.y while the app is young);
# - a push to the `release` branch builds every platform and publishes "AdminCraft vX.Y.Z"
#   with the tag vX.Y.Z and GitHub's generated notes ("What's Changed" + full changelog);
# - a nightly dry run on main builds everything but publishes nothing, so release-only
#   breakage shows up before release day;
# - "Run workflow" can override the version for a test run (e.g. 0.2.0-rc.1).
on:
  schedule:
    - cron: "56 1 * * *"
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

# Only the publish job may write (it creates the release); everything else reads.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        shell: bash
        # Inputs reach the script through the environment, never pasted into it.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a version: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ]; then dry=true; else dry=false; fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "AdminCraft $v (dry run: $dry)"
      - name: Tag must be new
        if: steps.v.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION exists already – raise the version in Cargo.toml."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64-portable
            ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
      EXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          dir="admincraft-${VERSION}-${NAME}"
          mkdir "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${TARGET}/release/admincraft.exe" "$dir/AdminCraft.exe"
          else
            cp "target/${TARGET}/release/admincraft" "$dir/admincraft"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$dir/"
          if [ "$EXT" = "zip" ]; then
            pwsh -Command "Compress-Archive -Path '$dir/*' -DestinationPath '$dir.zip'"
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: admincraft-${{ needs.version.outputs.version }}-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum admincraft-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "v$VERSION" dist/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "AdminCraft v$VERSION" \
            --generate-notes $pre
