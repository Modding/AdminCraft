name: Release

# A tag like v0.2.0 builds the portable programs for Windows, Linux and macOS and attaches them
# to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: admincraft.exe
            asset: AdminCraft-windows-x64.exe
          - os: ubuntu-latest
            file: admincraft
            asset: AdminCraft-linux-x64
          - os: macos-latest
            file: admincraft
            asset: AdminCraft-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release --locked
      - name: Rename
        shell: bash
        run: cp "target/release/${{ matrix.file }}" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}
