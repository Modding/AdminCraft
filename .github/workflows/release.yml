name: Release

# Same scheme as the other Craft apps:
# - the version lives in Cargo.toml (semantic versioning, 0.x.y while the app is young);
# - a push to the `release` branch builds every platform and publishes "AdminCraft vX.Y.Z"
#   with the tag vX.Y.Z and GitHub's generated notes ("What's Changed" + full changelog);
# - a nightly dry run on main builds everything but publishes nothing, so release-only
#   breakage shows up before release day;
# - "Run workflow" can override the version for a test run (e.g. 0.2.0-rc.1).
on:
  schedule:
    - cron: "56 1 * * *"
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then dry=true; else dry=false; fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "AdminCraft $v (dry run: $dry)"
      - name: Tag must be new
        if: steps.v.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ steps.v.outputs.version }} exists already – raise the version in Cargo.toml."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64-portable
            ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="admincraft-${VERSION}-${{ matrix.name }}"
          mkdir "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/admincraft.exe" "$dir/AdminCraft.exe"
          else
            cp "target/${{ matrix.target }}/release/admincraft" "$dir/admincraft"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md "$dir/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            pwsh -Command "Compress-Archive -Path '$dir/*' -DestinationPath '$dir.zip'"
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: admincraft-${{ needs.version.outputs.version }}-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum admincraft-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish "AdminCraft v${{ needs.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "v$VERSION" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AdminCraft v$VERSION" \
            --generate-notes $pre
