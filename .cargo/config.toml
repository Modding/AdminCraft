# Windows: link the C runtime statically, so the program is a single portable .exe
# (no vcruntime140.dll or libunwind.dll next to it).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]
